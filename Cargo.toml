[package]
name = "wenget"
version = "3.9.0"
edition = "2021"
authors = ["wen"]
description = "A cross-platform package manager for GitHub binaries"
license = "MIT"
repository = "https://github.com/superyngo/wenget"
keywords = ["package-manager", "github", "binary", "portable"]
categories = ["command-line-utilities"]

[dependencies]
# CLI framework
clap = { version = "4.5", features = ["derive"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }


# JSON processing
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Archive handling
zip = { version = "8.6", default-features = false, features = ["deflate", "bzip2", "zstd"] }
tar = "0.4"
flate2 = "1.0"
xz2 = "0.1"
sevenz-rust2 = { version = "0.23", default-features = false, features = ["util", "bzip2", "ppmd"] }
bzip2 = "0.6"

# Progress bar
indicatif = "0.17"

# Colored output
colored = "2.1"

# Error handling
anyhow = "1.0"

# Checksum verification
sha2 = "0.10"

# Logging
env_logger = "0.11"
log = "0.4"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
glob = "0.3"
pathdiff = "0.2"
dialoguer = "0.11"
console = "0.15"

# Platform-specific dependencies
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3.8"
sevenz-rust2 = { version = "0.23", default-features = false, features = ["util", "compress"] }
assert_cmd = "2.2.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
